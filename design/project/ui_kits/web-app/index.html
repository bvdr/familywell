<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>html,body{height:100%}body{margin:0;background:var(--surface)}#root{height:100vh}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="../_shared/icons.jsx"></script>
<script type="text/babel" src="./WebLogin.jsx"></script>
<script type="text/babel" src="./WebDashboard.jsx"></script>
<script type="text/babel" src="./WebTodos.jsx"></script>
<script type="text/babel">
const { TopNav, Button } = window.FamilyWellDesignSystem_c7911f;
function App(){
  const [authed,setAuthed]=React.useState(false);
  const [tab,setTab]=React.useState("core");
  const I=window.Icons;
  if(!authed) return <window.WebLogin onSignIn={()=>setAuthed(true)} />;
  return <div style={{height:"100%",display:"flex",flexDirection:"column",background:"var(--bg)"}}>
    <TopNav mark={<I.leaf size={22}/>} activeLink={tab} onNavigate={setTab}
      links={[{id:"core",label:"Core"},{id:"todos",label:"Shopping"}]}
      familyName="The Rivera Family" user={{initials:"MR"}}
      right={<Button size="sm" leadingIcon={<I.plus size={16}/>}>Quick add</Button>} />
    <div style={{flex:1,minHeight:0}}>
      {tab==="todos" ? <window.WebTodos/> : <window.WebDashboard/>}
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
