<!-- @dsCard group="Components" viewport="700x460" name="Navigation" subtitle="TopNav (web) & TabBar (mobile)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--surface)}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.frame{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--bg)}
.phone{width:300px;background:var(--bg);border:1px solid var(--border);border-radius:24px;padding-top:120px;position:relative;overflow:hidden;height:200px}
</style></head><body>
<div id="root"></div>
<script type="text/babel">
const NS = window.FamilyWellDesignSystem_c7911f;
const { TopNav, TabBar, Button } = NS;
const I = (p) => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{p}</svg>;
const Home = <>{I(<><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></>)}</>;
const Cal = I(<><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></>);
const List = I(<><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></>);
const Users = I(<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></>);
const Plus = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>;
const Leaf = <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>;
function Demo(){
  const [tab,setTab]=React.useState("home");
  const [link,setLink]=React.useState("core");
  return <div style={{display:"flex",flexDirection:"column",gap:24}}>
    <div><div className="lbl">TopNav — web</div>
      <div className="frame"><TopNav mark={Leaf} activeLink={link} onNavigate={setLink}
        links={[{id:"core",label:"Core"},{id:"todos",label:"Todos"},{id:"shopping",label:"Shopping"}]}
        familyName="The Rivera Family" user={{initials:"MR"}}
        right={<Button size="sm" leadingIcon={<Plus/>}>Quick add</Button>} />
      </div>
    </div>
    <div><div className="lbl">TabBar — mobile</div>
      <div className="phone">
        <TabBar activeId={tab} onSelect={setTab} style={{position:"absolute",left:0,right:0,bottom:0}}
          items={[{id:"home",label:"Home",icon:Home},{id:"calendar",label:"Calendar",icon:Cal},{id:"tasks",label:"Tasks",icon:List},{id:"family",label:"Family",icon:Users}]}/>
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
