<!-- @dsCard group="Components" viewport="700x520" name="Core" subtitle="Button, Input, Card, Checkbox, Avatar, Badge, IconButton" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--bg)}
.grid{display:flex;flex-direction:column;gap:22px;max-width:640px}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Button, Input, Card, Checkbox, Avatar, Badge, IconButton } = window.FamilyWellDesignSystem_c7911f;
const Plus = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>;
const Bell = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>;
function Demo(){
  const [c1,setC1]=React.useState(true);const [c2,setC2]=React.useState(false);
  return <div className="grid">
    <div><div className="lbl">Button — variants & sizes</div><div className="row">
      <Button variant="primary" leadingIcon={<Plus/>}>Quick add</Button>
      <Button variant="secondary">Invite</Button>
      <Button variant="ghost">Cancel</Button>
      <Button variant="danger">Delete</Button>
      <Button variant="primary" size="sm">Small</Button>
      <Button variant="primary" disabled>Disabled</Button>
    </div></div>
    <div><div className="lbl">Input</div><div className="row" style={{gap:20}}>
      <div style={{width:280}}><Input label="Email" placeholder="you@example.com" helper="We'll never share it." /></div>
      <div style={{width:280}}><Input label="Email" error helper="Please enter a valid email address." defaultValue="not-an-email" /></div>
    </div></div>
    <div className="row" style={{gap:24,alignItems:"flex-start"}}>
      <div><div className="lbl">Checkbox</div><div style={{display:"flex",flexDirection:"column",gap:10}}>
        <Checkbox checked={c1} onChange={setC1} label="Buy groceries for dinner"/>
        <Checkbox checked={c2} onChange={setC2} label="Book summer camp"/>
      </div></div>
      <div><div className="lbl">Avatar</div><div className="row">
        <Avatar initial="S" tint="sage" size={44}/><Avatar initial="J" tint="blue" size={44}/>
        <Avatar initial="E" tint="clay" size={44}/><Avatar initial="MR" tint="accent" size={44}/>
      </div></div>
      <div><div className="lbl">IconButton</div><div className="row">
        <IconButton icon={<Bell/>} variant="subtle" ariaLabel="Notifications"/>
        <IconButton icon={<Plus/>} variant="solid" ariaLabel="Add"/>
        <IconButton icon={<Bell/>} variant="surface" ariaLabel="Alerts"/>
      </div></div>
    </div>
    <div><div className="lbl">Badge</div><div className="row">
      <Badge>3 remaining</Badge><Badge variant="warning" dot>Due today</Badge>
      <Badge variant="error" dot>Overdue</Badge><Badge variant="neutral">Mom</Badge>
      <Badge variant="solid">New</Badge>
    </div></div>
    <div><div className="lbl">Card — surface & accent bar</div><div className="row" style={{gap:12,alignItems:"stretch"}}>
      <Card style={{width:260}}><div style={{fontFamily:"var(--font-heading)",fontSize:18,fontWeight:600}}>Shared Tasks</div><div style={{color:"var(--text-secondary)",fontSize:14,marginTop:4}}>3 remaining today</div></Card>
      <Card accentBar="var(--warning)" style={{width:260}}><div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:500,fontSize:15}}>Dentist appointment</span><span style={{fontFamily:"var(--font-mono)",fontSize:12,color:"var(--text-muted)"}}>11:30</span></div><div style={{color:"var(--text-secondary)",fontSize:13,marginTop:2}}>Leo</div></Card>
    </div></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
