<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;background:var(--bg);display:flex;gap:24px;align-items:center}
.a{display:flex;flex-direction:column;gap:8px;align-items:center}
.av{width:52px;height:52px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:20px;color:var(--text-primary)}
.n{font-size:12px;color:var(--text-muted)}
</style></head><body>
<div class="a"><span class="av" style="background:#C8DBBC">S</span><span class="n">sage</span></div>
<div class="a"><span class="av" style="background:#B8C9D4">J</span><span class="n">blue</span></div>
<div class="a"><span class="av" style="background:#E6D4C8">E</span><span class="n">clay</span></div>
<div class="a"><span class="av" style="background:#D4C8E6">L</span><span class="n">lilac</span></div>
<div class="a"><span class="av" style="background:#2D5E3A;color:#fff">MR</span><span class="n">accent</span></div>
<div class="a"><span class="av" style="background:#E6F0E0;color:#2D5E3A">A</span><span class="n">subtle</span></div>
</body></html>
