<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;background:var(--bg)}
.row{display:flex;gap:12px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border)}
.n{font-size:12px;font-weight:500;color:var(--text-primary)}
.h{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:#C8DBBC"></div><span class="n">Accent Light</span><span class="h">#C8DBBC</span></div>
<div class="sw"><div class="chip" style="background:#E6F0E0"></div><span class="n">Accent Subtle</span><span class="h">#E6F0E0</span></div>
<div class="sw"><div class="chip" style="background:#2D5E3A"></div><span class="n">Accent</span><span class="h">#2D5E3A</span></div>
<div class="sw"><div class="chip" style="background:#234B2E"></div><span class="n">Accent Hover</span><span class="h">#234B2E</span></div>
</div></body></html>
