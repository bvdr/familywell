<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Error, warning & success" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;background:var(--bg)}
.row{display:flex;gap:12px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:64px;border-radius:var(--radius-md)}
.n{font-size:12px;font-weight:500;color:var(--text-primary)}
.h{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:#C2453A"></div><span class="n">Error</span><span class="h">#C2453A</span></div>
<div class="sw"><div class="chip" style="background:#D4943A"></div><span class="n">Warning</span><span class="h">#D4943A</span></div>
<div class="sw"><div class="chip" style="background:#2D5E3A"></div><span class="n">Success</span><span class="h">#2D5E3A</span></div>
<div class="sw"><div class="chip" style="background:#1B3A28"></div><span class="n">Forest (dark surf.)</span><span class="h">#1B3A28</span></div>
</div></body></html>
