<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="4 · 8 · 16 · 24 · 32 · 48" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;background:var(--bg);display:flex;gap:20px;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:8px;align-items:center}
.bar{background:var(--accent-light);border-radius:4px;width:100%}
.box{display:flex;align-items:flex-end;height:56px}
.n{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.t{font-size:12px;font-weight:500;color:var(--text-primary)}
</style></head><body>
<div class="col"><div class="box"><div class="bar" style="height:4px"></div></div><span class="t">xs</span><span class="n">4</span></div>
<div class="col"><div class="box"><div class="bar" style="height:8px"></div></div><span class="t">sm</span><span class="n">8</span></div>
<div class="col"><div class="box"><div class="bar" style="height:16px"></div></div><span class="t">md</span><span class="n">16</span></div>
<div class="col"><div class="box"><div class="bar" style="height:24px"></div></div><span class="t">lg</span><span class="n">24</span></div>
<div class="col"><div class="box"><div class="bar" style="height:32px"></div></div><span class="t">xl</span><span class="n">32</span></div>
<div class="col"><div class="box"><div class="bar" style="height:48px"></div></div><span class="t">2xl</span><span class="n">48</span></div>
</body></html>
