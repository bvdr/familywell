<!-- @dsCard group="Colors" viewport="700x150" name="Greens" subtitle="Forest, Accent, Sage & Moss — the brand core" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;background:var(--bg)}
.row{display:flex;gap:12px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:64px;border-radius:var(--radius-md)}
.n{font-size:12px;font-weight:500;color:var(--text-primary)}
.h{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:#1B3A28"></div><span class="n">Forest</span><span class="h">#1B3A28</span></div>
<div class="sw"><div class="chip" style="background:#2D5E3A"></div><span class="n">Accent</span><span class="h">#2D5E3A</span></div>
<div class="sw"><div class="chip" style="background:#4A6B52"></div><span class="n">Sage</span><span class="h">#4A6B52</span></div>
<div class="sw"><div class="chip" style="background:#7A9A80"></div><span class="n">Moss</span><span class="h">#7A9A80</span></div>
</div></body></html>
