<!-- @dsCard group="Brand" viewport="700x230" name="Voice & Tone" subtitle="Warm, calm, plain-spoken — never clinical" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;background:var(--bg);display:flex;flex-direction:column;gap:14px}
.pair{display:flex;gap:16px}
.c{flex:1;background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;display:flex;flex-direction:column;gap:6px}
.lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.03em;text-transform:uppercase}
.do .lbl{color:var(--success)}.dont .lbl{color:var(--error)}
.dont{border-color:#E5C9C5}
.q{font-family:var(--font-body);font-size:15px;color:var(--text-primary)}
.dont .q{color:var(--text-muted);text-decoration:line-through}
.h{font-family:var(--font-heading);font-size:20px;font-weight:600}
</style></head><body>
<span class="h">Speak like a helpful family member</span>
<div class="pair">
<div class="c do"><span class="lbl">Say</span><span class="q">Good morning — 3 things need your attention today.</span></div>
<div class="c dont"><span class="lbl">Not</span><span class="q">SYSTEM ALERT: 3 pending action items require resolution.</span></div>
</div>
<div class="pair">
<div class="c do"><span class="lbl">Say</span><span class="q">Nothing due today. Enjoy the quiet. 🌿</span></div>
<div class="c dont"><span class="lbl">Not</span><span class="q">You have 0 (zero) tasks in queue.</span></div>
</div>
</body></html>
