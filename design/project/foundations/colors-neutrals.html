<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;background:var(--bg)}
.row{display:flex;gap:12px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border)}
.n{font-size:12px;font-weight:500;color:var(--text-primary)}
.h{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:#F5F3EE"></div><span class="n">Background</span><span class="h">#F5F3EE</span></div>
<div class="sw"><div class="chip" style="background:#E8E4DC"></div><span class="n">Surface</span><span class="h">#E8E4DC</span></div>
<div class="sw"><div class="chip" style="background:#FFFFFF"></div><span class="n">Card</span><span class="h">#FFFFFF</span></div>
<div class="sw"><div class="chip" style="background:#D4D0C8"></div><span class="n">Border</span><span class="h">#D4D0C8</span></div>
</div></body></html>
