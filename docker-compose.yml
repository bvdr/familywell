services:
  app:
    # pull: true re-downloads the base image (dunglas/frankenphp:1-php8.3) on every build. Without it Docker reuses
    # its cached copy forever, so `docker compose up -d --build` would never pick up a PHP security release.
    build: { context: ., pull: true }
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: familywell
      DB_USERNAME: familywell
      DB_PASSWORD: familywell
      # BROADCAST_CONNECTION comes from .env (log by default). Forcing reverb here crashed a fresh clone on boot:
      # .env.example has no REVERB_APP_* credentials, so Laravel couldn't build the broadcaster (issue #267).
      # Realtime is opt-in, see "Realtime updates" in docs/self-hosting.md.
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_PUBLIC_HOST: localhost
      REVERB_PUBLIC_PORT: 8080
      REVERB_PUBLIC_SCHEME: http
      REVERB_SCALING_ENABLED: "true"
      REDIS_HOST: redis
    depends_on:
      db: { condition: service_started }
      redis: { condition: service_started }
      # Only started with --profile realtime; not required for the app to run.
      reverb: { condition: service_started, required: false }
  reverb:
    # Optional realtime server: `docker compose --profile realtime up -d` once REVERB_APP_* are set in .env.
    profiles: [realtime]
    build: { context: ., pull: true }
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    # The image's HEALTHCHECK probes FrankenPHP's admin port, which Reverb doesn't run, so it would always read
    # "unhealthy". Check Reverb's own port instead.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
    ports: ["8080:8080"]
    env_file: .env
    environment:
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REVERB_SCALING_ENABLED: "true"
      REDIS_HOST: redis
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_DATABASE: familywell
      DB_USERNAME: familywell
      DB_PASSWORD: familywell
    depends_on: [redis]
  redis:
    image: redis:7-alpine
    # Localhost only: Docker's published ports bypass host firewalls like ufw, so "6379:6379" exposed an
    # unauthenticated Redis to the internet on a public VPS. The app reaches it over the compose network.
    ports: ["127.0.0.1:6379:6379"]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: familywell
      POSTGRES_USER: familywell
      POSTGRES_PASSWORD: familywell
    # Localhost only, same reason: this Postgres uses the default familywell/familywell login.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
volumes:
  dbdata:
