name: tests

on:
  push:
    branches:
      - dev
      - main
  # Run on every pull request, including stacked PRs whose base is a feature branch.
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: JS Unit Tests
        run: npm run test:js

      - name: Create SQLite Database
        run: touch database/database.sqlite

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Tests
        run: ./vendor/bin/pest

      # UI guardrail: every page at 390x844 and 1280x800, signed in as the seeded demo family, must have no
      # sideways scroll, cut-off content or overlapping text (tests/Viewports, playwright.config.ts).
      # Pest above runs on in-memory SQLite, so database/database.sqlite is free for the seeded app.
      - name: Seed the demo family for the viewport checks
        run: |
          php artisan migrate --force
          php artisan modules:migrate
          php artisan db:seed --class=DemoSeeder --force

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Viewport checks (390 + 1280)
        env:
          # php artisan serve with a few workers, so parallel page loads don't queue behind each other.
          PHP_CLI_SERVER_WORKERS: 4
        run: npm run test:viewports

      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-screenshots
          path: |
            tests/Viewports/screenshots/
            tests/Viewports/report/
          if-no-files-found: ignore
