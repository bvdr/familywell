name: release

# Self-hosters run release tags (:stable, :vX.Y.Z, :vX.Y); familywell.co keeps deploying :latest from main.
# Why: :latest is every merge to main (including half-finished preview modules), which is right for prod but
# too fast for people upgrading their own server. A release is a deliberate "this one is good" from the maintainer.
#
# Cut one with: gh release create v1.2.3 --generate-notes   (tags main's HEAD; the tag push triggers this)
#
# A release PROMOTES the image prod already built for that commit (deploy.yml tags every build with the sha),
# so self-hosters get byte-for-byte what familywell.co ran. Only if that commit was never built (e.g. a
# docs-only merge skips deploy) do we build it here, from the same Dockerfile.
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/familywell
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release tags
        id: tags
        run: |
          v="${GITHUB_REF_NAME}"            # v1.2.3
          minor="${v%.*}"                    # v1.2
          echo "list=$IMAGE:$v,$IMAGE:$minor,$IMAGE:stable" >> "$GITHUB_OUTPUT"

      - name: Check for the image prod already built
        id: existing
        run: |
          if docker buildx imagetools inspect "$IMAGE:${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote the prod image
        if: steps.existing.outputs.found == 'true'
        run: |
          args=()
          IFS=',' read -ra tags <<< "${{ steps.tags.outputs.list }}"
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE:${GITHUB_SHA}"

      - name: Build (commit was never deployed)
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show PHP version in the release
        run: |
          docker pull -q "$IMAGE:${GITHUB_REF_NAME}" >/dev/null
          docker run --rm --entrypoint php "$IMAGE:${GITHUB_REF_NAME}" -v | head -1 | tee -a "$GITHUB_STEP_SUMMARY"
