# DigitalOcean App Platform spec for Familywell (P8).
#
# NO SECRET VALUES LIVE HERE. This file is committed, so it carries only non-secret config.
# The secret env vars (APP_KEY, the REVERB_APP_* trio) and the GHCR pull credentials are injected
# at apply time by .do/apply.sh from the untracked .env.do and `gh auth token`. Applying this file
# directly with `doctl apps update` would DELETE those secrets, because the App Platform spec is
# declarative. Always go through .do/apply.sh.
#
# WHY A PRE-BUILT IMAGE INSTEAD OF THE GITHUB SOURCE:
# App Platform's native github: source is the better setup (it builds on push and needs no registry),
# but it requires DigitalOcean's GitHub app to be authorized against the private bvdr/familywell repo,
# which is a browser OAuth flow no CLI can perform. The API rejects it today with
# "GitHub user not authenticated". So we build the image ourselves and pull it from GHCR (free for
# private packages) instead. To switch back once the GitHub app is authorized, replace each `image:`
# block with the `github:` block shown below and drop .do/push.sh:
#
#     github: { repo: bvdr/familywell, branch: main, deploy_on_push: true }
#     dockerfile_path: Dockerfile
name: familywell
region: fra

databases:
  # Pre-existing managed cluster (created out-of-band so its tier/cost is explicit, not implied).
  # Attaching it here is also what puts the app in the cluster's trusted sources.
  - name: db
    engine: PG
    version: "16"
    cluster_name: familywell-db
    production: true
    db_name: familywell
    db_user: familywell

# Custom domain (DNS lives in Cloudflare, external to DO). No `zone:` field, so DO treats these as
# external and issues a Let's Encrypt cert once the Cloudflare CNAMEs point at the app's ingress.
# familywell.co is PRIMARY (an ALIAS needs a PRIMARY custom domain to alias to). Safe: DO's
# ${APP_DOMAIN}/${APP_URL} bind to the default *.ondigitalocean.app ingress, not the custom primary,
# so nothing about the running app changes until DNS points here.
domains:
  - domain: familywell.co
    type: PRIMARY
  - domain: www.familywell.co
    type: ALIAS
  # MCP server address for AI assistants (https://mcp.familywell.co/mcp). Same app, no host routing:
  # login/consent/tokens stay on familywell.co (MCP_AUTHORIZATION_SERVER below), see docs/mcp.md.
  - domain: mcp.familywell.co
    type: ALIAS

envs:
  - key: APP_NAME
    value: Familywell
    scope: RUN_TIME
  - key: APP_ENV
    value: production
    scope: RUN_TIME
  - key: APP_DEBUG
    value: "false"
    scope: RUN_TIME
  # Canonical URL is the custom domain (not the ${APP_URL} default ingress), so generated links,
  # redirects, and password-reset emails use familywell.co.
  - key: APP_URL
    value: https://familywell.co
    scope: RUN_TIME
  # MCP: the protected-resource document served on mcp.familywell.co points clients at this host for
  # OAuth (login, consent, tokens), and Settings > Connected apps shows the address to paste.
  # PASSPORT_PRIVATE_KEY / PASSPORT_PUBLIC_KEY (token signing) are SECRETS injected by apply.sh.
  - key: MCP_AUTHORIZATION_SERVER
    value: https://familywell.co
    scope: RUN_TIME
  - key: MCP_SERVER_URL
    value: https://mcp.familywell.co/mcp
    scope: RUN_TIME
  # App Platform captures stdout/stderr as app logs; a file log would just fill an ephemeral disk.
  - key: LOG_CHANNEL
    value: stderr
    scope: RUN_TIME
  - key: LOG_LEVEL
    value: info
    scope: RUN_TIME

  - key: DB_CONNECTION
    value: pgsql
    scope: RUN_TIME
  - key: DB_HOST
    value: ${db.HOSTNAME}
    scope: RUN_TIME
  - key: DB_PORT
    value: ${db.PORT}
    scope: RUN_TIME
  - key: DB_DATABASE
    value: ${db.DATABASE}
    scope: RUN_TIME
  - key: DB_USERNAME
    value: ${db.USERNAME}
    scope: RUN_TIME
  - key: DB_PASSWORD
    value: ${db.PASSWORD}
    scope: RUN_TIME
  # DO managed Postgres only accepts TLS connections.
  - key: DB_SSLMODE
    value: require
    scope: RUN_TIME

  # CONNECTION POOLING (fixes the deploy-breaking "remaining connection slots reserved for SUPERUSER"):
  # the main `pgsql` connection runs through the PgBouncer transaction pool on web+reverb (their
  # per-component DB_PORT/DB_DATABASE below), which shares few backend connections across many workers.
  # But transaction-mode pooling aborts the transaction-wrapped CACHE/SESSION/QUEUE writes with Postgres
  # 25P02, so those stores use a DIRECT connection (`pgsql_direct`) instead. `pgsql_direct` reads
  # DB_DIRECT_PORT/DB_DIRECT_DATABASE; ${db.*} always resolves to the cluster's DIRECT 25060/familywell
  # regardless of the pooled DB_PORT/DB_DATABASE overrides, so the direct side is pinned here. The
  # PRE_DEPLOY migrate job inherits the top-level pgsql (direct) — it never pools (DDL needs a session).
  - key: DB_CACHE_CONNECTION
    value: pgsql_direct
    scope: RUN_TIME
  - key: DB_CACHE_LOCK_CONNECTION
    value: pgsql_direct
    scope: RUN_TIME
  - key: SESSION_CONNECTION
    value: pgsql_direct
    scope: RUN_TIME
  - key: DB_QUEUE_CONNECTION
    value: pgsql_direct
    scope: RUN_TIME
  - key: DB_DIRECT_PORT
    value: ${db.PORT}
    scope: RUN_TIME
  - key: DB_DIRECT_DATABASE
    value: ${db.DATABASE}
    scope: RUN_TIME

  # All three are the database driver: no Redis in this deployment (see the P8 plan, finding 2).
  - key: SESSION_DRIVER
    value: database
    scope: RUN_TIME
  # Keep people signed in for 2 weeks (minutes). Sessions are rolling, so active users stay in.
  - key: SESSION_LIFETIME
    value: "20160"
    scope: RUN_TIME
  - key: CACHE_STORE
    value: database
    scope: RUN_TIME
  - key: QUEUE_CONNECTION
    value: database
    scope: RUN_TIME

  - key: BROADCAST_CONNECTION
    value: reverb
    scope: RUN_TIME
  # Reverb scaling needs Redis. We run exactly one Reverb instance, so it stays off.
  # Turning this on without also adding Redis AND raising reverb's instance_count is a footgun.
  - key: REVERB_SCALING_ENABLED
    value: "false"
    scope: RUN_TIME

  # Default disk stays local; receipts use the explicit `r2` disk (config/filesystems.php).
  - key: FILESYSTEM_DISK
    value: local
    scope: RUN_TIME
  # Cloudflare R2 (S3-compatible) for spend receipts. Endpoint + bucket are non-secret; the access
  # key + secret are injected as SECRET by apply.sh. The bucket is private; the app streams objects
  # through an auth-gated route, never a public URL.
  - key: R2_ENDPOINT
    value: https://4bfbdd8c267944d0b0cb8d49c862d34f.r2.cloudflarestorage.com
    scope: RUN_TIME
  - key: R2_BUCKET
    value: familywell
    scope: RUN_TIME

  # Umami analytics: website "FamilyWell.co" on analytics.dragonpie.co. Not secret (it ships in the page).
  - key: UMAMI_WEBSITE_ID
    value: 387d1b2c-f687-44d0-bd91-05b61defa5ec
    scope: RUN_TIME

  # Stripe paywall (FamilyWell account, USD prices). STRIPE_KEY being set is what turns the paywall on.
  # STRIPE_SECRET (a restricted rk_live key) and STRIPE_WEBHOOK_SECRET are SECRETS injected by apply.sh;
  # all of them live in 1Password folio-dev "FamilyWell Stripe LIVE".
  - key: STRIPE_KEY
    value: pk_live_51UOWOSD66FjwmQ4egmbaUkhqcVq0xlk6SHbb4b1uTR4E7x6722oemTb4fUJZ7yHSNVcT1hOO4NbIGrkhLltJN3VU00jMItoDJy
    scope: RUN_TIME
  - key: STRIPE_PRICE_MONTHLY
    value: price_1UOsfmD66FjwmQ4eJJ8ewxVW
    scope: RUN_TIME
  - key: STRIPE_PRICE_YEARLY
    value: price_1UOsfmD66FjwmQ4esjCQCHY4
    scope: RUN_TIME

  # Mail via Resend SMTP. MAIL_PASSWORD (the Resend API key) is injected as a SECRET by apply.sh.
  # Sender is @familywell.co, verified in Resend (DKIM/SPF records live in the Cloudflare zone).
  - key: MAIL_MAILER
    value: smtp
    scope: RUN_TIME
  - key: MAIL_HOST
    value: smtp.resend.com
    scope: RUN_TIME
  - key: MAIL_PORT
    value: "587"
    scope: RUN_TIME
  - key: MAIL_ENCRYPTION
    value: tls
    scope: RUN_TIME
  - key: MAIL_USERNAME
    value: resend
    scope: RUN_TIME
  - key: MAIL_FROM_ADDRESS
    value: hello@familywell.co
    scope: RUN_TIME
  - key: MAIL_FROM_NAME
    value: Familywell
    scope: RUN_TIME

services:
  - name: web
    image:
      registry_type: GHCR
      registry: bvdr
      repository: familywell
      tag: latest
    # 2 x 1 GB (2026-10-07): the single 512 MB basic-xxs sat at 98% memory and was OOM-killed (503 while it
    # rebooted). Two instances also keep the site up while one restarts or deploys. Sessions/cache are in
    # Postgres, so instances share state without sticky sessions.
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 2
    http_port: 8000
    # Cap FrankenPHP workers: each worker holds ONE direct cache/session/queue Postgres connection, so
    # the worker count is a hard input to the connection budget (2 instances x 6 workers = 12 direct conns
    # + the 15-conn pool + ~3 for reverb/scheduler/migrate = ~30, within db-s-1vcpu-2gb's ~47 usable).
    # --max-requests recycles workers so per-worker memory can't creep.
    run_command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000 --workers=6 --max-requests=500
    health_check:
      http_path: /up
    envs:
      # Main DB connection through the PgBouncer transaction pool. Host/user/password are shared with
      # the cluster (so ${db.*} still resolve); only the port and db name differ from the direct 25060.
      - key: DB_PORT
        value: "25061"
        scope: RUN_TIME
      - key: DB_DATABASE
        value: familywell-pool
        scope: RUN_TIME
      # Server-to-server: the web service publishes broadcast events to Reverb over the app's
      # private network, so this stays plain HTTP and never leaves DO.
      - key: REVERB_HOST
        value: ${reverb.PRIVATE_DOMAIN}
        scope: RUN_TIME
      - key: REVERB_PORT
        value: "8080"
        scope: RUN_TIME
      - key: REVERB_SCHEME
        value: http
        scope: RUN_TIME
      # Browser-facing: Echo connects back through the public ingress on 443, which is a different
      # host/port/scheme than the private one above. ShareRealtime passes these to the browser.
      - key: REVERB_PUBLIC_HOST
        value: familywell.co
        scope: RUN_TIME
      - key: REVERB_PUBLIC_PORT
        value: "443"
        scope: RUN_TIME
      - key: REVERB_PUBLIC_SCHEME
        value: https
        scope: RUN_TIME

  - name: reverb
    image:
      registry_type: GHCR
      registry: bvdr
      repository: familywell
      tag: latest
    # Same image as web, different process: override the Dockerfile's Octane CMD.
    run_command: php artisan reverb:start --host=0.0.0.0 --port=8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    # Pinned at 1: more than one instance requires Redis for Reverb's scaling channel.
    instance_count: 1
    http_port: 8080
    health_check:
      # Reverb serves its own /up (vendor/laravel/reverb Factory.php), distinct from Laravel's.
      http_path: /up
    envs:
      - key: REVERB_HOST
        value: 0.0.0.0
        scope: RUN_TIME
      # Same as web: main DB through the pool, cache/session/queue direct (top-level hooks). One process,
      # so at most ~1 direct connection.
      - key: DB_PORT
        value: "25061"
        scope: RUN_TIME
      - key: DB_DATABASE
        value: familywell-pool
        scope: RUN_TIME

workers:
  # Laravel's scheduler, always on: `schedule:work` wakes every minute and runs due scheduled
  # commands. Today that is recurring-todos:tick (hourly), which resets recurring to-dos on their
  # next occurrence. Single process; it inherits the top-level DIRECT db connection (no pool
  # override, unlike web/reverb), so it holds ~1 backend connection. Smallest instance size.
  - name: scheduler
    image:
      registry_type: GHCR
      registry: bvdr
      repository: familywell
      tag: latest
    run_command: php artisan schedule:work
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

jobs:
  - name: migrate
    image:
      registry_type: GHCR
      registry: bvdr
      repository: familywell
      tag: latest
    # PRE_DEPLOY: schema is migrated before the new containers take traffic. Billed per second,
    # so a job that runs for a few seconds per deploy costs effectively nothing.
    kind: PRE_DEPLOY
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    # Both commands, not just the first: `migrate` builds the core schema, while `modules:migrate`
    # runs each module's own migrations AND writes the `modules` rows that mark them installed.
    # Without the second, a fresh database has no installed modules, so the marketplace page lists
    # nothing and no widget can ever be enabled. Both are idempotent, so re-running per deploy is fine.
    #
    # The explicit `sh -c` is load-bearing. The base image's ENTRYPOINT (docker-php-entrypoint) ends
    # in `exec "$@"`, so a bare `a && b` here does NOT get a shell: the first command runs, the `&&`
    # tail is silently dropped, and the job still exits 0. That failure is invisible in the logs.
    run_command: sh -c "php artisan migrate --force && php artisan modules:migrate"

ingress:
  rules:
    # Longest-prefix wins, so these two must be matched before the catch-all below.
    # preserve_path_prefix is required: App Platform strips the matched prefix by default, and
    # Reverb routes on the full /app/{key} and /apps/{id}/... paths.
    - component:
        name: reverb
        preserve_path_prefix: true
      match:
        path:
          prefix: /app
    - component:
        name: reverb
        preserve_path_prefix: true
      match:
        path:
          prefix: /apps
    - component:
        name: web
      match:
        path:
          prefix: /
